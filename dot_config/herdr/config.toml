# herdr — Gruvbox dark, matching ~/.config/tmux/tmux.conf, Ghostty and lazygit.
# Theme and the tab-bar tweak below, plus `onboarding`, which herdr writes
# itself after the first-run tour (captured via `chezmoi re-add`). Everything
# else stays at herdr's defaults.
#
# herdr's built-in gruvbox leaves the sidebar background unset, so it inherits
# Ghostty's Gruvbox Dark Hard #1d2021; the tab bar and chrome sit one step
# lighter on #282828. Run `herdr server reload-config` (or prefix+shift+r) to
# pick this up in a running session.
onboarding = false

[theme]
name = "gruvbox"

[ui]
# The tab row is the top bar inside every Ghostty surface (tab_bar_position
# defaults to "top"). With a single tab it carries no information worth a row,
# so hide it there and let it reappear as soon as a second tab exists.
hide_tab_bar_when_single_tab = true
